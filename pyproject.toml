[project]
name = "kubectl-readonly"
version = "0.1.0"
description = "A safe kubectl wrapper that only allows read-only commands"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []
license = "MIT"
authors = [
    { name = "Evaneos Tech" }
]
keywords = ["kubernetes", "kubectl", "readonly", "safe", "wrapper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
kubectl-readonly = "kubectl_readonly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kubectl_readonly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]
