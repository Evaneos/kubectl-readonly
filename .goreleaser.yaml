# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kubectl-readonly

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: kubectl-readonly
    binary: kubectl-readonly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Evaneos
    name: kubectl-readonly
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
