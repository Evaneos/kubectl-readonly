# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kubectl-readonly

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: kubectl-readonly
    main: .
    binary: kubectl-readonly
    env: &build-env
      - CGO_ENABLED=0
    goos: &build-goos
      - linux
      - darwin
      - windows
    goarch: &build-goarch
      - amd64
      - arm64
    ldflags: &build-ldflags
      - -s -w
      - -X github.com/Evaneos/kubectl-readonly/internal/cli.version={{.Version}}
      - -X github.com/Evaneos/kubectl-readonly/internal/cli.commit={{.Commit}}
      - -X github.com/Evaneos/kubectl-readonly/internal/cli.date={{.Date}}
  - id: kubectl-readonly-strict
    main: ./cmd/kubectl-readonly-strict
    binary: kubectl-readonly-strict
    env: *build-env
    goos: *build-goos
    goarch: *build-goarch
    ldflags: *build-ldflags
  - id: kubectl-readonly-leaky
    main: ./cmd/kubectl-readonly-leaky
    binary: kubectl-readonly-leaky
    env: *build-env
    goos: *build-goos
    goarch: *build-goarch
    ldflags: *build-ldflags

# One archive per binary: each krew plugin (.krew/*.yaml) points to its own.
archives:
  - id: kubectl-readonly
    ids: [kubectl-readonly]
    name_template: "kubectl-readonly_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: &archive-formats [tar.gz]
    format_overrides: &archive-format-overrides
      - goos: windows
        formats: [zip]
    files: &archive-files
      - README.md
      - LICENSE*
  - id: kubectl-readonly-strict
    ids: [kubectl-readonly-strict]
    name_template: "kubectl-readonly-strict_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: *archive-formats
    format_overrides: *archive-format-overrides
    files: *archive-files
  - id: kubectl-readonly-leaky
    ids: [kubectl-readonly-leaky]
    name_template: "kubectl-readonly-leaky_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: *archive-formats
    format_overrides: *archive-format-overrides
    files: *archive-files

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Evaneos
    name: kubectl-readonly
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
