# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/krew/master/pkg/index/spec/embedded_plugin_schema.json
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: readonly
spec:
  version: v0.2.0
  homepage: https://github.com/Evaneos/kubectl-readonly
  shortDescription: Safe kubectl wrapper that only allows read-only commands
  description: |
    A safe kubectl wrapper that only allows read-only commands.
    Ideal for giving AI assistants (like Claude) unrestricted access to explore
    Kubernetes clusters, including production, without risk of accidental modifications.

    Features:
    - Allowlist-based: Only explicitly allowed commands can run
    - Secrets protection: Can list secrets but not view their values
    - Context switching: Can switch contexts safely
    - No side effects: All allowed commands are read-only

    Allowed commands include: get, describe, logs, top, explain, api-resources,
    api-versions, cluster-info, version, events, wait, diff, and safe subcommands
    of config, auth, and rollout.
  caveats: |
    This plugin requires kubectl to be installed and available in your PATH.

    Usage:
      kubectl readonly get pods
      kubectl readonly describe deployment nginx
      kubectl readonly logs my-pod -f

    Or use the binary directly:
      kubectl-readonly get pods
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.2.0/kubectl-readonly_0.2.0_linux_amd64.tar.gz
    sha256: "PLACEHOLDER_SHA256_LINUX_AMD64"
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.2.0/kubectl-readonly_0.2.0_linux_arm64.tar.gz
    sha256: "PLACEHOLDER_SHA256_LINUX_ARM64"
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.2.0/kubectl-readonly_0.2.0_darwin_amd64.tar.gz
    sha256: "PLACEHOLDER_SHA256_DARWIN_AMD64"
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.2.0/kubectl-readonly_0.2.0_darwin_arm64.tar.gz
    sha256: "PLACEHOLDER_SHA256_DARWIN_ARM64"
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.2.0/kubectl-readonly_0.2.0_windows_amd64.zip
    sha256: "PLACEHOLDER_SHA256_WINDOWS_AMD64"
    bin: kubectl-readonly.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.2.0/kubectl-readonly_0.2.0_windows_arm64.zip
    sha256: "PLACEHOLDER_SHA256_WINDOWS_ARM64"
    bin: kubectl-readonly.exe
