./scripts/generate-krew-manifest.sh v0.3.1
# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/krew/master/pkg/index/spec/embedded_plugin_schema.json
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: readonly
spec:
  version: v0.3.1
  homepage: https://github.com/Evaneos/kubectl-readonly
  shortDescription: Read-only kubectl wrapper to prevent accidental modifications
  description: |
    A kubectl wrapper that only allows read-only commands.
    Designed to prevent accidental modifications when AI assistants (like Claude)
    explore Kubernetes clusters, including production.

    Features:
    - Allowlist-based: Only explicitly allowed commands can run
    - Secrets protection: Can list secrets but not view their values
    - Context switching: Can switch contexts without side effects
    - No side effects: All allowed commands are read-only

    Allowed commands include: get, describe, logs, top, explain, api-resources,
    api-versions, cluster-info, version, events, wait, diff, and read-only subcommands
    of config, auth, and rollout.
  caveats: |
    This plugin requires kubectl to be installed and available in your PATH.

    Usage:
      kubectl readonly get pods
      kubectl readonly describe deployment nginx
      kubectl readonly logs my-pod -f

    Or use the binary directly:
      kubectl-readonly get pods
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.3.1/kubectl-readonly_0.3.1_linux_amd64.tar.gz
    sha256: "641b69f93f8dedc442d3f7fc08b764b70f0d67c99dc141d7f390e6d4ece46831"
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.3.1/kubectl-readonly_0.3.1_linux_arm64.tar.gz
    sha256: "22f62308d33937fc0b2c8e0de6d8416236728b03d101036c5ed38cbef8617d91"
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.3.1/kubectl-readonly_0.3.1_darwin_amd64.tar.gz
    sha256: "0a0a7d831fe6ca32b617670580869b9f79fe99c6b3f1638c93d0e33b33c2b3c0"
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.3.1/kubectl-readonly_0.3.1_darwin_arm64.tar.gz
    sha256: "9831b802cfffe3e590172bc8f88ceae9d2a49a5a78090bf4111330764ff9a8f4"
