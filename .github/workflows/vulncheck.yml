name: Vulncheck

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # vuln.go.dev answers 5xx from time to time: retry, except on findings (exit 3).
      - name: Scan source
        run: for i in 1 2 3; do govulncheck ./...; rc=$?; [ "$rc" = 0 ] || [ "$rc" = 3 ] && exit "$rc"; [ "$i" = 3 ] || sleep 20; done; exit 1

  # A published binary keeps the stdlib it was built with: only a rescan catches CVEs disclosed after the release.
  latest-release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Download latest release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*_linux_amd64.tar.gz' --dir release
          mkdir bin
          for a in release/*.tar.gz; do tar xzf "$a" -C bin --wildcards 'kubectl-readonly*'; done

      - name: Scan binaries
        run: |
          found=0
          for b in bin/*; do
            for i in 1 2 3; do
              rc=0; govulncheck -mode=binary "$b" || rc=$?
              [ "$rc" = 0 ] || [ "$rc" = 3 ] && break
              [ "$i" = 3 ] && exit 1
              sleep 20
            done
            [ "$rc" = 3 ] && found=1
          done
          [ "$found" = 0 ] || exit 3
